<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Trade - PocketTrading</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0A0F1A;
            color: #FFFFFF;
            overflow-x: hidden;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 20, 32, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            padding: 0 32px;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .logo-icon { font-size: 28px; }
        .logo-text {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #00D897, #00B8A0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-link {
            padding: 8px 20px;
            border-radius: 40px;
            color: #8B93A5;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(0, 216, 151, 0.1);
            color: #00D897;
        }
        .guest-buttons {
            display: flex;
            gap: 12px;
        }
        .btn-login, .btn-register {
            padding: 8px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-login {
            background: transparent;
            border: 1px solid rgba(0, 216, 151, 0.5);
            color: #00D897;
        }
        .btn-register {
            background: linear-gradient(135deg, #00D897, #00B8A0);
            color: white;
        }
        .user-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 16px 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            cursor: pointer;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #00D897, #00B8A0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .user-name {
            font-size: 14px;
            font-weight: 600;
        }
        .admin-badge {
            font-size: 10px;
            background: linear-gradient(135deg, #00D897, #00B8A0);
            padding: 2px 8px;
            border-radius: 20px;
            color: white;
            margin-left: 6px;
        }
        .admin-link {
            padding: 8px 16px;
            background: rgba(0, 216, 151, 0.15);
            border: 1px solid rgba(0, 216, 151, 0.3);
            border-radius: 40px;
            color: #00D897;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        .logout-btn {
            padding: 8px 20px;
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 40px;
            color: #FF4757;
            cursor: pointer;
            font-weight: 500;
        }
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 28px;
            color: white;
            cursor: pointer;
        }
        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            background: #0F1420;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            z-index: 999;
            flex-direction: column;
            gap: 12px;
        }
        .mobile-menu.show { display: flex; }
        .mobile-nav-link {
            padding: 12px;
            color: #8B93A5;
            text-decoration: none;
            border-radius: 12px;
        }
        .main-content {
            margin-top: 70px;
            padding: 20px 32px;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
        }
        .trading-layout {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .chart-section {
            flex: 1.5;
            min-width: 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .crypto-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .crypto-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .crypto-btn {
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #8B93A5;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .crypto-btn.active {
            background: linear-gradient(135deg, #00D897, #00B8A0);
            color: white;
            border-color: transparent;
        }
        .timeframes {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .time-btn {
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #8B93A5;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .time-btn.active {
            background: rgba(0, 216, 151, 0.2);
            color: #00D897;
            border-color: #00D897;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            background: #131722;
            border-radius: 12px;
            overflow: hidden;
            min-height: 500px;
        }
        .trade-form-section {
            flex: 1;
            min-width: 280px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }
        .trade-type-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .trade-type-btn {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .trade-type-btn.buy {
            background: rgba(0, 216, 151, 0.2);
            color: #00D897;
        }
        .trade-type-btn.buy.active {
            background: #00D897;
            color: white;
        }
        .trade-type-btn.sell {
            background: rgba(255, 71, 87, 0.2);
            color: #FF4757;
        }
        .trade-type-btn.sell.active {
            background: #FF4757;
            color: white;
        }
        .selected-coin {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .coin-name-large { font-size: 16px; font-weight: 700; }
        .coin-symbol { font-size: 11px; color: #8B93A5; margin-top: 2px; }
        .current-price-large { font-size: 22px; font-weight: 800; margin: 6px 0; }
        .live-badge { font-size: 10px; color: #FF4757; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 12px; color: #8B93A5; margin-bottom: 6px; display: block; }
        .amount-input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }
        .duration-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .duration-btn {
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .duration-btn.active {
            background: linear-gradient(135deg, #00D897, #00B8A0);
            border-color: transparent;
        }
        .duration-time { font-size: 12px; font-weight: 700; }
        .duration-payout { font-size: 10px; color: #00D897; margin-top: 2px; }
        .duration-min { font-size: 8px; color: #00D897; margin-top: 2px; }
        .trade-summary {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 16px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 5px 0;
        }
        .summary-row.total {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 6px;
            padding-top: 8px;
            font-weight: 700;
            font-size: 13px;
        }
        .trade-preview {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            border-left: 3px solid #00D897;
        }
        .preview-title {
            font-size: 12px;
            font-weight: 600;
            color: #00D897;
            margin-bottom: 10px;
        }
        .preview-win {
            background: rgba(0, 216, 151, 0.1);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .preview-loss {
            background: rgba(255, 71, 87, 0.1);
            border-radius: 8px;
            padding: 8px;
        }
        .preview-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 3px 0;
        }
        .confirm-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00D897, #00B8A0);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .confirm-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-required {
            text-align: center;
            padding: 50px 20px;
        }
        .login-required-icon { font-size: 56px; margin-bottom: 16px; }
        .login-required h3 { font-size: 22px; margin-bottom: 12px; }
        .login-required p { color: #8B93A5; margin-bottom: 28px; }
        .login-buttons { display: flex; gap: 16px; justify-content: center; }
        @media (max-width: 900px) {
            .trading-layout { flex-direction: column; }
            .chart-container { min-height: 400px; }
            .main-content { height: auto; }
            .duration-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .nav-links, .guest-buttons, .user-section { display: none; }
            .mobile-menu-btn { display: block; }
            .main-content { padding: 12px; height: auto; }
            .duration-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">📈</span>
                <span class="logo-text">PocketTrading</span>
            </a>
            <div class="nav-links" id="navLinks"></div>
            <div id="rightNav"></div>
            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        </div>
    </nav>
    <div class="mobile-menu" id="mobileMenu"></div>

    <div class="main-content">
        <div class="trading-layout">
            <div class="chart-section">
                <div class="crypto-selector">
                    <div class="crypto-buttons" id="cryptoButtons">
                        <button class="crypto-btn active" data-symbol="BTC">BTC</button>
                        <button class="crypto-btn" data-symbol="ETH">ETH</button>
                        <button class="crypto-btn" data-symbol="SOL">SOL</button>
                        <button class="crypto-btn" data-symbol="XRP">XRP</button>
                        <button class="crypto-btn" data-symbol="DOGE">DOGE</button>
                        <button class="crypto-btn" data-symbol="BNB">BNB</button>
                        <button class="crypto-btn" data-symbol="ADA">ADA</button>
                    </div>
                </div>
                <div class="timeframes" id="timeframes">
                    <button class="time-btn active" data-interval="1">1m</button>
                    <button class="time-btn" data-interval="5">5m</button>
                    <button class="time-btn" data-interval="15">15m</button>
                    <button class="time-btn" data-interval="60">1h</button>
                    <button class="time-btn" data-interval="240">4h</button>
                    <button class="time-btn" data-interval="1D">1d</button>
                    <button class="time-btn" data-interval="1W">1w</button>
                </div>
                <div class="chart-container" id="tv_chart_container"></div>
            </div>
            <div class="trade-form-section" id="tradeFormSection"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        // ============================================
        // TRADES PAGE - FULLY WORKING TRADE EXECUTION
        // ============================================
        
        let currentUser = null;
        let currentSymbol = 'BTC';
        let currentPrice = 78312.00;
        let currentTradeType = 'buy';
        let selectedDuration = 30;
        let selectedPayout = 12;
        let selectedMinAmount = 100;
        let selectedMaxAmount = 10000;
        let tvWidget = null;
        let priceUpdateInterval = null;

        const durationConfig = {
            30: { payout: 12, min: 100, max: 10000 },
            60: { payout: 18, min: 15000, max: 45000 },
            90: { payout: 25, min: 50000, max: 120000 },
            120: { payout: 30, min: 200000, max: 350000 },
            180: { payout: 35, min: 500000, max: 750000 },
            300: { payout: 45, min: 1000000, max: 1300000 }
        };

        const cryptoData = {
            BTC: { name: 'Bitcoin', pair: 'BINANCE:BTCUSDT', price: 78312.00 },
            ETH: { name: 'Ethereum', pair: 'BINANCE:ETHUSDT', price: 2297.32 },
            SOL: { name: 'Solana', pair: 'BINANCE:SOLUSDT', price: 168.42 },
            XRP: { name: 'Ripple', pair: 'BINANCE:XRPUSDT', price: 0.624 },
            DOGE: { name: 'Dogecoin', pair: 'BINANCE:DOGEUSDT', price: 0.162 },
            BNB: { name: 'Binance Coin', pair: 'BINANCE:BNBUSDT', price: 615.81 },
            ADA: { name: 'Cardano', pair: 'BINANCE:ADAUSDT', price: 0.483 }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await waitForAuth();
            currentUser = auth.getUser();
            updateNavbar();
            
            if (currentUser) {
                await loadUserBalance();
                showTradeForm();
                initTradingView();
                setupEventListeners();
                startPriceUpdates();
            } else {
                showLoginRequired();
                initTradingView();
                setupEventListeners();
                startPriceUpdates();
            }
            
            window.addEventListener('authStateChanged', (e) => {
                currentUser = e.detail.user;
                updateNavbar();
                if (currentUser) {
                    showTradeForm();
                    loadUserBalance();
                } else {
                    showLoginRequired();
                }
            });
        });

        function waitForAuth() {
            return new Promise((resolve) => {
                const check = setInterval(() => {
                    if (typeof auth !== 'undefined') {
                        clearInterval(check);
                        resolve();
                    }
                }, 100);
                setTimeout(() => {
                    clearInterval(check);
                    resolve();
                }, 3000);
            });
        }

        function updateNavbar() {
            const navLinks = document.getElementById('navLinks');
            const rightNav = document.getElementById('rightNav');
            const mobileMenu = document.getElementById('mobileMenu');
            
            if (!navLinks) return;
            
            if (currentUser) {
                const isAdmin = currentUser.email === 'ephremgojo@gmail.com';
                const userName = currentUser.name || currentUser.email.split('@')[0];
                
                navLinks.innerHTML = `
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="markets.html" class="nav-link">Markets</a>
                    <a href="trades.html" class="nav-link active">Trades</a>
                    <a href="profile.html" class="nav-link">My Profile</a>
                `;
                
                rightNav.innerHTML = `
                    <div class="user-section">
                        <div class="user-info">
                            <div class="user-avatar">${userName.charAt(0).toUpperCase()}</div>
                            <div class="user-name">${userName}${isAdmin ? '<span class="admin-badge">Admin</span>' : ''}</div>
                        </div>
                        ${isAdmin ? '<a href="admin.html" class="admin-link">⚙️ Admin Panel</a>' : ''}
                        <button class="logout-btn" onclick="logout()">Logout</button>
                    </div>
                `;
                
                mobileMenu.innerHTML = `
                    <a href="index.html" class="mobile-nav-link">🏠 Home</a>
                    <a href="markets.html" class="mobile-nav-link">📊 Markets</a>
                    <a href="trades.html" class="mobile-nav-link">🔄 Trades</a>
                    <a href="profile.html" class="mobile-nav-link">👤 My Profile</a>
                    ${isAdmin ? '<a href="admin.html" class="mobile-nav-link">⚙️ Admin Panel</a>' : ''}
                    <button class="logout-btn" style="margin-top:12px;" onclick="logout()">Logout</button>
                `;
            } else {
                navLinks.innerHTML = `
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="markets.html" class="nav-link">Markets</a>
                    <a href="trades.html" class="nav-link active">Trades</a>
                `;
                
                rightNav.innerHTML = `
                    <div class="guest-buttons">
                        <a href="login.html" class="btn-login">Login</a>
                        <a href="login.html" class="btn-register">Register</a>
                    </div>
                `;
                
                mobileMenu.innerHTML = `
                    <a href="index.html" class="mobile-nav-link">🏠 Home</a>
                    <a href="markets.html" class="mobile-nav-link">📊 Markets</a>
                    <a href="trades.html" class="mobile-nav-link">🔄 Trades</a>
                    <a href="login.html" class="mobile-nav-link">🔐 Login</a>
                    <a href="login.html" class="mobile-nav-link">📝 Register</a>
                `;
            }
        }

        function showLoginRequired() {
            const container = document.getElementById('tradeFormSection');
            if (!container) return;
            container.innerHTML = `
                <div class="login-required">
                    <div class="login-required-icon">🔒</div>
                    <h3>Login Required</h3>
                    <p>Please login or register to start trading</p>
                    <div class="login-buttons">
                        <a href="login.html" class="btn-login">Login</a>
                        <a href="login.html" class="btn-register">Register</a>
                    </div>
                </div>
            `;
        }

        async function loadUserBalance() {
            try {
                const userData = await supabaseDB.getUserById(currentUser.id);
                if (userData) {
                    currentUser.balance = userData.balance || 0;
                }
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        function showTradeForm() {
            const container = document.getElementById('tradeFormSection');
            if (!container) return;
            
            container.innerHTML = `
                <div class="trade-type-buttons">
                    <button class="trade-type-btn buy active" data-type="buy">BUY</button>
                    <button class="trade-type-btn sell" data-type="sell">SELL</button>
                </div>
                <div class="selected-coin">
                    <div class="coin-name-large" id="selectedCoinName">${cryptoData[currentSymbol].name}</div>
                    <div class="coin-symbol" id="selectedCoinSymbol">${currentSymbol}/USD</div>
                    <div class="current-price-large" id="currentPrice">$${cryptoData[currentSymbol].price.toLocaleString()}</div>
                    <div class="live-badge">● LIVE</div>
                </div>
                <div class="form-group">
                    <div class="form-label">Amount (USDT)</div>
                    <input type="number" id="tradeAmount" class="amount-input" placeholder="Enter amount" step="10">
                </div>
                <div class="form-label">Select Duration</div>
                <div class="duration-grid" id="durationGrid">
                    <div class="duration-btn active" data-duration="30" data-payout="12" data-min="100" data-max="10000">
                        <div class="duration-time">30s</div>
                        <div class="duration-payout">+12%</div>
                        <div class="duration-min">Min: $100</div>
                    </div>
                    <div class="duration-btn" data-duration="60" data-payout="18" data-min="15000" data-max="45000">
                        <div class="duration-time">60s</div>
                        <div class="duration-payout">+18%</div>
                        <div class="duration-min">Min: $15K</div>
                    </div>
                    <div class="duration-btn" data-duration="90" data-payout="25" data-min="50000" data-max="120000">
                        <div class="duration-time">90s</div>
                        <div class="duration-payout">+25%</div>
                        <div class="duration-min">Min: $50K</div>
                    </div>
                    <div class="duration-btn" data-duration="120" data-payout="30" data-min="200000" data-max="350000">
                        <div class="duration-time">120s</div>
                        <div class="duration-payout">+30%</div>
                        <div class="duration-min">Min: $200K</div>
                    </div>
                    <div class="duration-btn" data-duration="180" data-payout="35" data-min="500000" data-max="750000">
                        <div class="duration-time">180s</div>
                        <div class="duration-payout">+35%</div>
                        <div class="duration-min">Min: $500K</div>
                    </div>
                    <div class="duration-btn" data-duration="300" data-payout="45" data-min="1000000" data-max="1300000">
                        <div class="duration-time">300s</div>
                        <div class="duration-payout">+45%</div>
                        <div class="duration-min">Min: $1M</div>
                    </div>
                </div>
                <div class="trade-summary">
                    <div class="summary-row">
                        <span>Available Balance:</span>
                        <span id="availableBalance">${(currentUser?.balance || 0).toLocaleString()} USDT</span>
                    </div>
                    <div class="summary-row">
                        <span>Transaction Fee (2%):</span>
                        <span id="feeAmount">0.00 USDT</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total to Pay:</span>
                        <span id="totalAmount" style="color: #00D897;">0.00 USDT</span>
                    </div>
                </div>
                <div class="trade-preview" id="tradePreview">
                    <div class="preview-title">📊 TRADE PREVIEW</div>
                    <div class="preview-win">
                        <div class="preview-row"><span>✅ IF YOU WIN:</span><span id="previewProfit" style="color: #00D897;">+$0.00</span></div>
                        <div class="preview-row"><span>Total Return:</span><span id="previewTotalReturn" style="color: #00D897;">$0.00</span></div>
                    </div>
                    <div class="preview-loss">
                        <div class="preview-row"><span>❌ IF YOU LOSE:</span><span id="previewLoss" style="color: #FF4757;">-$0.00</span></div>
                    </div>
                </div>
                <button class="confirm-btn" id="confirmTrade">Confirm Trade</button>
            `;
            
            attachEvents();
        }

        function attachEvents() {
            const buyBtn = document.querySelector('.trade-type-btn.buy');
            const sellBtn = document.querySelector('.trade-type-btn.sell');
            if (buyBtn && sellBtn) {
                buyBtn.addEventListener('click', () => {
                    buyBtn.classList.add('active');
                    sellBtn.classList.remove('active');
                    currentTradeType = 'buy';
                    updateTradeSummary();
                });
                sellBtn.addEventListener('click', () => {
                    sellBtn.classList.add('active');
                    buyBtn.classList.remove('active');
                    currentTradeType = 'sell';
                    updateTradeSummary();
                });
            }

            document.querySelectorAll('.duration-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedDuration = parseInt(btn.dataset.duration);
                    selectedPayout = parseInt(btn.dataset.payout);
                    selectedMinAmount = parseInt(btn.dataset.min);
                    selectedMaxAmount = parseInt(btn.dataset.max);
                    updateTradeSummary();
                });
            });

            const amountInput = document.getElementById('tradeAmount');
            if (amountInput) amountInput.addEventListener('input', () => updateTradeSummary());

            const confirmBtn = document.getElementById('confirmTrade');
            if (confirmBtn) {
                confirmBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    executeTrade();
                });
            }
        }

        function updateTradeSummary() {
            const amount = parseFloat(document.getElementById('tradeAmount')?.value) || 0;
            const fee = amount * 0.02;
            const total = amount + fee;
            const profitAmount = amount * (selectedPayout / 100);
            const totalReturn = amount + profitAmount;
            
            const feeEl = document.getElementById('feeAmount');
            const totalEl = document.getElementById('totalAmount');
            const previewProfit = document.getElementById('previewProfit');
            const previewTotalReturn = document.getElementById('previewTotalReturn');
            const previewLoss = document.getElementById('previewLoss');
            const confirmBtn = document.getElementById('confirmTrade');
            const balance = currentUser?.balance || 0;
            const balanceEl = document.getElementById('availableBalance');
            
            if (balanceEl) {
                balanceEl.textContent = `${balance.toLocaleString()} USDT`;
                balanceEl.style.color = balance > 0 ? '#00D897' : '#FF4757';
            }
            
            if (feeEl) feeEl.textContent = `${fee.toFixed(2)} USDT`;
            if (totalEl) totalEl.textContent = `${total.toFixed(2)} USDT`;
            
            if (previewProfit && amount > 0) {
                previewProfit.innerHTML = `+$${profitAmount.toLocaleString()} (${selectedPayout}%)`;
                previewTotalReturn.innerHTML = `$${totalReturn.toLocaleString()}`;
                previewLoss.innerHTML = `-$${amount.toLocaleString()}`;
            } else if (previewProfit) {
                previewProfit.innerHTML = '+$0.00';
                previewTotalReturn.innerHTML = '$0.00';
                previewLoss.innerHTML = '-$0.00';
            }
            
            if (confirmBtn) {
                if (amount === 0) {
                    confirmBtn.disabled = true;
                    confirmBtn.textContent = 'Enter Amount';
                } else if (amount < selectedMinAmount) {
                    confirmBtn.disabled = true;
                    confirmBtn.textContent = `Min $${selectedMinAmount.toLocaleString()}`;
                } else if (amount > selectedMaxAmount) {
                    confirmBtn.disabled = true;
                    confirmBtn.textContent = `Max $${selectedMaxAmount.toLocaleString()}`;
                    showNotification(`Maximum amount for ${selectedDuration}s is $${selectedMaxAmount.toLocaleString()}`, 'error');
                } else if (amount > balance) {
                    confirmBtn.disabled = true;
                    confirmBtn.textContent = 'Insufficient Balance';
                } else {
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = 'Confirm Trade';
                }
            }
        }

        async function executeTrade() {
            const amount = parseFloat(document.getElementById('tradeAmount')?.value);
            
            if (!amount || amount < 10) {
                showNotification('Please enter a valid amount', 'error');
                return;
            }
            
            if (amount < selectedMinAmount) {
                showNotification(`Minimum amount for ${selectedDuration}s is $${selectedMinAmount.toLocaleString()}`, 'error');
                return;
            }
            
            if (amount > selectedMaxAmount) {
                showNotification(`Maximum amount for ${selectedDuration}s is $${selectedMaxAmount.toLocaleString()}`, 'error');
                return;
            }
            
            const fee = amount * 0.02;
            const total = amount + fee;
            
            if (total > (currentUser?.balance || 0)) {
                showNotification('Insufficient balance', 'error');
                return;
            }
            
            const profitAmount = amount * (selectedPayout / 100);
            const winAmount = amount + profitAmount;
            
            try {
                const newBalance = (currentUser.balance || 0) - total;
                await supabaseDB.updateUserBalance(currentUser.id, newBalance);
                currentUser.balance = newBalance;
                
                const trade = {
                    id: Date.now(),
                    user_id: currentUser.id,
                    symbol: currentSymbol,
                    type: currentTradeType,
                    amount: amount,
                    leverage: 1,
                    entry_price: currentPrice,
                    fee: fee,
                    status: 'open',
                    duration: selectedDuration,
                    payout_percent: selectedPayout,
                    expected_payout: winAmount,
                    created_at: new Date().toISOString()
                };
                
                await supabaseDB.createTrade(trade);
                await supabaseDB.createUserActivity({
                    id: Date.now(),
                    user_id: currentUser.id,
                    type: 'trade',
                    title: 'Trade Placed',
                    description: `${currentTradeType.toUpperCase()} $${amount.toLocaleString()} ${currentSymbol} for ${selectedDuration}s (${selectedPayout}% payout)`,
                    created_at: new Date().toISOString()
                });
                
                showNotification(`Trade placed! ${currentTradeType.toUpperCase()} $${amount.toLocaleString()} for ${selectedDuration}s.`, 'success');
                
                document.getElementById('tradeAmount').value = '';
                updateTradeSummary();
                
                // Simulate result after duration
                setTimeout(() => simulateTradeResult(trade), selectedDuration * 1000);
                
            } catch (error) {
                console.error('Error executing trade:', error);
                showNotification('Failed to execute trade. Please try again.', 'error');
            }
        }

        async function simulateTradeResult(trade) {
            const profitAmount = trade.amount * (trade.payout_percent / 100);
            const winAmount = trade.amount + profitAmount;
            
            const isWin = Math.random() < 0.55;
            
            if (isWin) {
                const newBalance = (currentUser.balance || 0) + winAmount;
                try {
                    await supabaseDB.updateUserBalance(currentUser.id, newBalance);
                    currentUser.balance = newBalance;
                    
                    await supabaseDB.updateTrade(trade.id, {
                        status: 'closed',
                        result: 'win',
                        pnl: winAmount,
                        profit_percent: trade.payout_percent,
                        closed_at: new Date().toISOString()
                    });
                    
                    await supabaseDB.createUserActivity({
                        id: Date.now(),
                        user_id: currentUser.id,
                        type: 'trade_win',
                        title: 'Trade Won!',
                        description: `Won $${winAmount.toLocaleString()} on ${trade.symbol} ($${profitAmount.toLocaleString()} profit at ${trade.payout_percent}%)`,
                        created_at: new Date().toISOString()
                    });
                    
                    await supabaseDB.createTransaction({
                        id: Date.now(),
                        user_id: currentUser.id,
                        amount: winAmount,
                        type: 'trade_win',
                        description: `Won trade on ${trade.symbol}`,
                        date: new Date().toISOString()
                    });
                    
                    updateTradeSummary();
                    showNotification(`🎉 WIN! You won $${winAmount.toLocaleString()}! ($${profitAmount.toLocaleString()} profit at ${trade.payout_percent}%)`, 'success');
                } catch (err) {
                    console.error('Win update error:', err);
                }
            } else {
                try {
                    await supabaseDB.updateTrade(trade.id, {
                        status: 'closed',
                        result: 'loss',
                        pnl: -trade.amount,
                        closed_at: new Date().toISOString()
                    });
                    
                    await supabaseDB.createUserActivity({
                        id: Date.now(),
                        user_id: currentUser.id,
                        type: 'trade_loss',
                        title: 'Trade Lost',
                        description: `Lost $${trade.amount.toLocaleString()} on ${trade.symbol}`,
                        created_at: new Date().toISOString()
                    });
                    
                    updateTradeSummary();
                    showNotification(`😢 LOSS! You lost $${trade.amount.toLocaleString()}`, 'error');
                } catch (err) {
                    console.error('Loss update error:', err);
                }
            }
            // Refresh balance display
            const balanceEl = document.getElementById('availableBalance');
            if (balanceEl) {
                balanceEl.textContent = `${(currentUser.balance || 0).toLocaleString()} USDT`;
                balanceEl.style.color = currentUser.balance > 0 ? '#00D897' : '#FF4757';
            }
        }

      async function logout() {
        try {
          await PHPAuth.logout();
        } catch (error) {
          console.error("Logout failed:", error);
        }
        window.location.href = "index.html";
      }

      async function refreshUser() {
        try {
          const result = await PHPAuth.currentUser();
          currentUser = result.user || result.data?.user || currentUser;
          const balance = Number(currentUser?.balance);
          currentUser.balance = Number.isFinite(balance) ? balance : 0;
        } catch (error) {
          console.error("Account refresh failed:", error);
          showMessage("Could not refresh account information.", "error");
        }
      }
