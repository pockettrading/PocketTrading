
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0A0F1A">
    <title>My Profile - PocketTrading</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #0A0F1A;
            --panel: #0F1420;
            --panel-light: rgba(255,255,255,.045);
            --border: rgba(255,255,255,.09);
            --text: #FFFFFF;
            --muted: #8B93A5;
            --green: #00D897;
            --green-dark: #00B8A0;
            --red: #FF4757;
            --orange: #FFA502;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Inter, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        a { color: inherit; }
        button, input, select, textarea { font: inherit; }
        button { cursor: pointer; }
        button:disabled { opacity: .55; cursor: not-allowed; }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(15,20,32,.97);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            padding: 0 24px;
        }

        .nav-container {
            max-width: 1450px;
            height: 68px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            white-space: nowrap;
        }

        .logo-icon { font-size: 25px; }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: var(--green);
            letter-spacing: -.5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--muted);
            padding: 9px 14px;
            border-radius: 30px;
            font-size: 13px;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--green);
            background: rgba(0,216,151,.09);
        }

        #rightNav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 5px 12px 5px 6px;
            background: var(--panel-light);
            border: 1px solid var(--border);
            border-radius: 30px;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg,var(--green),var(--green-dark));
            border-radius: 50%;
            color: #06251C;
            font-weight: 800;
        }

        .user-name { font-size: 12px; font-weight: 700; }
        .admin-badge {
            display: inline-block;
            font-size: 10px;
            padding: 3px 7px;
            margin-left: 4px;
            border-radius: 12px;
            background: rgba(0,216,151,.16);
            color: var(--green);
        }

        .admin-link, .logout-btn {
            padding: 9px 13px;
            border-radius: 22px;
            text-decoration: none;
            font-size: 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
        }

        .admin-link { color: var(--green); }
        .logout-btn { color: var(--red); border-color: rgba(255,71,87,.3); }

        .mobile-menu-btn {
            display: none;
            border: 0;
            background: transparent;
            color: white;
            font-size: 27px;
            padding: 4px 8px;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            z-index: 999;
            top: 68px;
            left: 0;
            right: 0;
            padding: 14px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex-direction: column;
            gap: 6px;
        }

        .mobile-menu.show { display: flex; }

        .mobile-nav-link {
            padding: 12px;
            text-decoration: none;
            color: var(--muted);
            border-radius: 9px;
        }

        .mobile-nav-link:hover { background: var(--panel-light); color: var(--green); }

        .profile-container {
            display: flex;
            min-height: 100vh;
            padding-top: 68px;
        }

        .profile-sidebar {
            position: fixed;
            top: 68px;
            bottom: 0;
            left: 0;
            width: 245px;
            overflow-y: auto;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px 12px;
            z-index: 100;
        }

        .sidebar-heading {
            padding: 0 12px 16px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.4px;
        }

        .sidebar-menu { display: flex; flex-direction: column; gap: 5px; }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            color: var(--muted);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: .2s;
        }

        .sidebar-item:hover { background: var(--panel-light); color: white; }

        .sidebar-item.active {
            background: rgba(0,216,151,.11);
            color: var(--green);
            border: 1px solid rgba(0,216,151,.12);
        }

        .sidebar-icon { width: 21px; font-size: 17px; }

        .profile-content {
            width: calc(100% - 245px);
            margin-left: 245px;
            padding: 28px;
            min-width: 0;
        }

        .content-header { margin-bottom: 22px; }
        .content-header h2 { font-size: 25px; margin-bottom: 6px; }
        .content-header p { color: var(--muted); font-size: 13px; line-height: 1.6; }

        .welcome-section {
            padding: 25px;
            margin-bottom: 22px;
            border: 1px solid rgba(0,216,151,.18);
            border-radius: 17px;
            background: linear-gradient(120deg,rgba(0,216,151,.10),rgba(0,184,160,.025));
        }

        .welcome-title { font-size: 25px; margin-bottom: 9px; }
        .welcome-subtitle { color: var(--muted); font-size: 13px; line-height: 1.6; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4,minmax(0,1fr));
            gap: 14px;
            margin-bottom: 22px;
        }

        .stat-card {
            padding: 19px;
            background: var(--panel-light);
            border: 1px solid var(--border);
            border-radius: 15px;
            min-width: 0;
        }

        .stat-icon { font-size: 22px; margin-bottom: 12px; }
        .stat-label { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
        .stat-value { font-size: clamp(17px,2vw,24px); font-weight: 800; overflow-wrap: anywhere; }

        .card, .chart-card {
            background: var(--panel-light);
            border: 1px solid var(--border);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card-header {
            padding: 17px 19px;
            border-bottom: 1px solid var(--border);
        }

        .card-header h3 { font-size: 15px; font-weight: 700; }
        .card-body { padding: 20px; }

        .charts-row {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .chart-card { padding: 17px; margin-bottom: 0; }
        .chart-title { font-size: 14px; font-weight: 700; margin-bottom: 17px; }
        .chart-container { height: 230px; position: relative; }

        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

        .action-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 11px 16px;
            border-radius: 24px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
        }

        .action-btn.deposit { background: var(--green); color: #05251D; }
        .action-btn.withdraw { border: 1px solid var(--border); color: white; }
        .action-btn.trade { border: 1px solid rgba(0,216,151,.3); color: var(--green); }

        .profile-details {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 16px;
        }

        .detail-item {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            min-width: 0;
        }

        .detail-label { color: var(--muted); font-size: 11px; margin-bottom: 7px; }
        .detail-value { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }

        .form-group { margin-bottom: 17px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #B6BDCA;
            font-size: 12px;
            font-weight: 600;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 13px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: #0B111D;
            color: white;
            font-size: 13px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: rgba(0,216,151,.6);
        }

        .form-group select option { background: var(--panel); }
        .form-group textarea { resize: vertical; min-height: 110px; }

        .btn-save {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            border: 0;
            border-radius: 25px;
            padding: 13px 17px;
            background: linear-gradient(135deg,var(--green),var(--green-dark));
            color: #05251D;
            font-size: 13px;
            font-weight: 800;
        }

        .btn-secondary {
            display: inline-flex;
            justify-content: center;
            padding: 10px 14px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            text-decoration: none;
            font-size: 12px;
        }

        .notice {
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,165,2,.22);
            background: rgba(255,165,2,.06);
            color: #E9C77D;
            font-size: 12px;
            line-height: 1.65;
            margin-bottom: 17px;
        }

        .status-message {
            margin-top: 12px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--muted);
        }

        .kyc-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .kyc-verified { background: rgba(0,216,151,.13); color: var(--green); }
        .kyc-pending { background: rgba(255,165,2,.13); color: var(--orange); }
        .kyc-none { background: rgba(255,71,87,.13); color: #FF7884; }

        .kyc-two-columns {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 20px;
        }

        .upload-area {
            padding: 25px 15px;
            border: 1px dashed rgba(255,255,255,.2);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            background: rgba(0,0,0,.12);
        }

        .upload-area:hover { border-color: var(--green); }
        .upload-icon { font-size: 29px; margin-bottom: 9px; }
        .upload-area p { font-size: 12px; margin-bottom: 7px; }
        .upload-area small { color: var(--muted); font-size: 10px; }
        .file-input { display: none; }

        .file-preview {
            display: none;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,0,0,.2);
            border-radius: 10px;
        }

        .preview-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .preview-info { flex: 1; min-width: 100px; font-size: 11px; }
        .preview-info span { display: block; overflow-wrap: anywhere; margin-bottom: 4px; }
        .remove-file {
            border: 0;
            border-radius: 15px;
            padding: 7px 10px;
            background: rgba(255,71,87,.15);
            color: #FF7884;
            font-size: 11px;
        }

        .table-wrap { width: 100%; overflow-x: auto; }
        .trades-table { width: 100%; min-width: 600px; border-collapse: collapse; font-size: 12px; }
        .trades-table th, .trades-table td {
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .trades-table th { color: var(--muted); font-weight: 600; background: rgba(0,0,0,.12); }

        .activity-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }
        .activity-item:last-child { border-bottom: 0; }
        .activity-item small { color: var(--muted); }

        .danger-zone {
            margin-top: 20px;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,71,87,.25);
            background: rgba(255,71,87,.055);
        }

        .danger-zone h4 { color: #FF7884; font-size: 14px; margin-bottom: 8px; }
        .danger-zone p { color: var(--muted); font-size: 12px; line-height: 1.6; margin-bottom: 14px; }

        .btn-danger {
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,71,87,.35);
            background: rgba(255,71,87,.12);
            color: #FF7884;
            font-size: 12px;
        }

        .tab-content[hidden] { display: none !important; }

        .empty-state {
            padding: 24px 12px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.7;
        }

        .page-footer {
            padding: 20px 0 5px;
            text-align: center;
            color: var(--muted);
            font-size: 10px;
        }

        @media (max-width: 1100px) {
            .nav-container { gap: 8px; }
            .nav-link { padding: 8px 9px; }
            .profile-content { padding: 22px 18px; }
            .stats-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
        }

        @media (max-width: 800px) {
            .navbar { padding: 0 13px; }
            .nav-container { height: 64px; }
            .nav-links { display: none; }
            #rightNav { margin-left: auto; }
            .user-info { padding-right: 8px; }
            .user-name { max-width: 95px; overflow: hidden; text-overflow: ellipsis; }
            .admin-link { display: none; }
            .mobile-menu-btn { display: block; }
            .mobile-menu { top: 64px; }

            .profile-container { padding-top: 64px; }
            .profile-sidebar {
                top: 64px;
                width: 265px;
                transform: translateX(-105%);
                transition: transform .25s ease;
                box-shadow: 10px 0 30px rgba(0,0,0,.2);
            }
            .profile-sidebar.show { transform: translateX(0); }
            .profile-content { width: 100%; margin-left: 0; padding: 18px 14px; }
            .welcome-section { padding: 20px; }
            .welcome-title { font-size: 21px; }
            .charts-row { grid-template-columns: 1fr; }
            .kyc-two-columns { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .logo-text { font-size: 17px; }
            .logo-icon { font-size: 21px; }
            .user-section { gap: 5px; }
            .user-info { gap: 6px; padding: 4px; border: 0; background: transparent; }
            .user-avatar { width: 30px; height: 30px; font-size: 13px; }
            .user-name { max-width: 75px; font-size: 11px; }
            .logout-btn { padding: 8px 10px; font-size: 11px; }
            .profile-content { padding: 15px 11px; }
            .content-header h2 { font-size: 22px; }
            .stats-grid { gap: 9px; }
            .stat-card { padding: 13px; }
            .stat-value { font-size: 17px; }
            .stat-label { font-size: 10px; }
            .profile-details { grid-template-columns: 1fr; }
            .card-body { padding: 14px; }
            .chart-container { height: 200px; }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">📈</span>
                <span class="logo-text">PocketTrading</span>
            </a>

            <div class="nav-links" id="navLinks">
                <a href="index.html" class="nav-link">Home</a>
                <a href="markets.html" class="nav-link">Markets</a>
                <a href="trades.html" class="nav-link">Trades</a>
            </div>

            <div id="rightNav"></div>
            <button class="mobile-menu-btn" id="mobileMenuBtn" type="button"
                aria-label="Open navigation menu" aria-expanded="false">☰</button>
        </div>
    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html" class="mobile-nav-link">Home</a>
        <a href="markets.html" class="mobile-nav-link">Markets</a>
        <a href="trades.html" class="mobile-nav-link">Trades</a>
        <a href="profile.html" class="mobile-nav-link">My Profile</a>
    </div>

    <div class="profile-container">
        <aside class="profile-sidebar" id="profileSidebar">
            <div class="sidebar-heading">Account Center</div>
            <div class="sidebar-menu">
                <div class="sidebar-item active" data-tab="dashboard" role="button" tabindex="0">
                    <span class="sidebar-icon">▦</span> Dashboard
                </div>
                <div class="sidebar-item" data-tab="profile" role="button" tabindex="0">
                    <span class="sidebar-icon">♙</span> User Profile
                </div>
                <div class="sidebar-item" data-tab="history" role="button" tabindex="0">
                    <span class="sidebar-icon">↗</span>
